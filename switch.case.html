<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case In Javascript</title>
</head>
<body>
    

    <script>
         let day = "Thursday"
    switch(day) {
            case"Monday":
            document.write("Go to Aptech");
            break;
            case"Tuesday":
            document.write("Go to Office");
            break;
            case"Wednessday":
            document.write("Go to Work");
            break;
            case"Thursday":
            document.write("Go to Shopping");
            break;
            case "Friday":
            document.write("Go to Work");
            break;
            case"Saturday":
            document.write("Go to Park");
            break;
            default:
            document.write("Invalid Name");
    }
    </script>
</body>
</html>
